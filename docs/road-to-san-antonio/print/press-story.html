<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cashbox press — Story frames</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap">
<style>
  /* Today's Cashbox trust→support sequence, 1080×1920. ?frame=1..6&lang=en|es
     Uses REAL article crops from ../press/ — never regenerated or rewritten. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #030202; color: #ede5d8; font-family: Inter, Arial, sans-serif; }
  .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(160deg, #020202 0%, #0a0602 55%, #030202 100%); }
  .glow { position: absolute; left: 50%; top: 40%; width: 1200px; height: 1200px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(120,60,10,0.4) 0%, rgba(120,60,10,0) 66%); }
  .z { position: absolute; left: 80px; right: 80px; top: 250px; bottom: 320px; display: flex; flex-direction: column; justify-content: center; gap: 36px; }
  .eyebrow { font-weight: 700; text-transform: uppercase; color: #c9a84c; letter-spacing: 0.28em; font-size: 28px; }
  .display { font-family: "Bebas Neue", Impact, sans-serif; letter-spacing: 0.04em; line-height: 0.95; }
  .gold { color: #c9a84c; }
  .body { font-size: 44px; line-height: 1.42; color: #c7bba9; }
  .paper { background: #f5f2ec; border-radius: 10px; padding: 26px; box-shadow: 0 30px 80px rgba(0,0,0,0.6); align-self: center; }
  .paper img { display: block; width: 100%; height: auto; border-radius: 4px; }
  .tag { align-self: center; font-size: 26px; letter-spacing: 0.24em; text-transform: uppercase; color: #a89880; font-weight: 700; }
  .list { display: grid; gap: 16px; }
  .list div { font-size: 56px; line-height: 1.15; color: #ede5d8; padding: 16px 0; border-top: 1px solid rgba(201,168,76,0.25); font-family: "Bebas Neue", Impact, sans-serif; letter-spacing: 0.05em; }
  .list div:last-child { border-bottom: 1px solid rgba(201,168,76,0.25); }
  .photo { align-self: center; width: 100%; border: 1px solid rgba(201,168,76,0.35); border-radius: 6px; overflow: hidden; }
  .photo img { display: block; width: 100%; height: auto; }
  .cta { align-self: flex-start; background: linear-gradient(135deg, #c9a84c, #b8902e); color: #000; font-family: "Bebas Neue", Impact, sans-serif; font-size: 56px; letter-spacing: 0.1em; padding: 26px 48px; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 330px; display: flex; justify-content: space-between; font-size: 26px; letter-spacing: 0.2em; text-transform: uppercase; color: #a89880; font-weight: 700; }
</style>
</head>
<body>
<div class="frame"><div class="glow"></div><div class="z" id="z"></div><div class="foot"><span>Road to San Antonio</span><span>malachiasmusic.com</span></div></div>
<script>
  const q = new URLSearchParams(location.search)
  const f = q.get('frame') || '1', lang = q.get('lang') === 'es' ? 'es' : 'en'
  const P = '../press/'
  const T = {
    en: {
      1: `<p class="display" style="font-size:150px">BEFORE THIS BAND<br><span class="gold">EVEN EXISTED…</span></p><div class="paper" style="max-width:760px"><img src="${P}cashbox-title.jpg" alt=""></div><p class="tag">Keep watching →</p>`,
      2: `<p class="eyebrow">March 2023 · Cashbox Magazine</p><div class="paper" style="max-width:820px"><img src="${P}cashbox-march-2023.jpg" alt=""></div><p class="body" style="text-align:center">Cashbox Magazine featured Malachias Gaskin&rsquo;s story.</p>`,
      3: `<div class="photo" style="max-width:640px"><img src="${P}cashbox-photo.jpg" alt=""></div><div class="list"><div>ARMY VETERAN</div><div>COMBAT MEDIC</div><div>IRAQ — TWICE</div><div>ARMY BANDSMAN</div></div><p class="body">Music became part of the mission.</p>`,
      4: `<p class="display" style="font-size:200px">2026.</p><div class="photo"><img src="../../../public/band-2026.jpg" alt=""></div><p class="display" style="font-size:110px">NEW BAND.<br><span class="gold">NEW CHAPTER.</span></p>`,
      5: `<div class="photo" style="max-height:660px"><img src="../../../public/Malachias 1.jpeg" alt="" style="object-fit:cover;max-height:660px"></div><p class="display" style="font-size:86px">NOW WE&rsquo;RE BRINGING THE FULL FIVE-PIECE BAND TO SAN ANTONIO <span class="gold">FOR VETERANS DAY.</span></p><p class="display gold" style="font-size:104px">NOV 12 🇺🇸</p>`,
      6: `<p class="eyebrow">Road to San Antonio</p><div class="list"><div>FLIGHTS ✈️</div><div>HOTEL 🏨</div><div>GUITARS 🎸</div><div>TRANSPORTATION 🚐</div><div>MEALS 🍽️</div></div><p class="display" style="font-size:110px">HELP US <span class="gold">GET THERE.</span></p><div class="cta">ROAD TO SAN ANTONIO</div>`,
    },
    es: {
      1: `<p class="display" style="font-size:150px">ANTES DE QUE ESTA BANDA<br><span class="gold">EXISTIERA…</span></p><div class="paper" style="max-width:760px"><img src="${P}cashbox-title.jpg" alt=""></div><p class="tag">Sigue mirando →</p>`,
      2: `<p class="eyebrow">Marzo 2023 · Cashbox Magazine</p><div class="paper" style="max-width:820px"><img src="${P}cashbox-march-2023.jpg" alt=""></div><p class="body" style="text-align:center">Cashbox Magazine ya contaba la historia de Malachias Gaskin.</p>`,
      3: `<div class="photo" style="max-width:640px"><img src="${P}cashbox-photo.jpg" alt=""></div><div class="list"><div>VETERANO DEL EJÉRCITO</div><div>MÉDICO DE COMBATE</div><div>IRAK — DOS VECES</div><div>MÚSICO DEL EJÉRCITO</div></div><p class="body">La música se volvió parte de la misión.</p>`,
      4: `<p class="display" style="font-size:200px">2026.</p><div class="photo"><img src="../../../public/band-2026.jpg" alt=""></div><p class="display" style="font-size:110px">NUEVA BANDA.<br><span class="gold">NUEVO CAPÍTULO.</span></p>`,
      5: `<div class="photo" style="max-height:660px"><img src="../../../public/Malachias 1.jpeg" alt="" style="object-fit:cover;max-height:660px"></div><p class="display" style="font-size:82px">AHORA QUEREMOS LLEVAR A LOS CINCO MÚSICOS A SAN ANTONIO <span class="gold">POR EL DÍA DE LOS VETERANOS.</span></p><p class="display gold" style="font-size:104px">12 NOV 🇺🇸</p>`,
      6: `<p class="eyebrow">Road to San Antonio</p><div class="list"><div>VUELOS ✈️</div><div>HOTEL 🏨</div><div>GUITARRAS 🎸</div><div>TRANSPORTE 🚐</div><div>COMIDAS 🍽️</div></div><p class="display" style="font-size:110px">AYÚDANOS A <span class="gold">LLEGAR.</span></p><div class="cta">ROAD TO SAN ANTONIO</div>`,
    },
  }
  document.getElementById('z').innerHTML = T[lang][f] || T[lang][1]
</script>
</body>
</html>
